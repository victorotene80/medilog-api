  # Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medilog-api-api:latest
    container_name: medilog_api
    restart: unless-stopped
    # Previous default left the app container without a Compose memory hint.
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Docker service-name overrides.
      # These override any local-development values in .env.
      DB_HOST: postgres
      DB_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Go runtime memory hints for local Compose.
      # Previous default left Go GC unconstrained by Compose.
      GOMEMLIMIT: ${API_GOMEMLIMIT:-384MiB}
      GOGC: ${API_GOGC:-75}

      #KAFKA_BROKERS: kafka:29092
      #RABBITMQ_DSN: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/

