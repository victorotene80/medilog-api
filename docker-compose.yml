services:
  postgres:
    image: postgres:16-alpine
    container_name: medilog_postgres
    restart: unless-stopped
    # Previous default used the Postgres image command with no explicit memory tuning.
    # command: ["postgres"]
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-512MB}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-384MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}"
    ports:
      # From your Mac: localhost:5433
      # From Docker containers: postgres:5432
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-medilog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medilog}
      POSTGRES_DB: ${DB_NAME:-medilog}
    volumes:
      - medilog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medilog} -d ${DB_NAME:-medilog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medilog_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Previous default kept Redis uncapped:
    # command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-redis}"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

