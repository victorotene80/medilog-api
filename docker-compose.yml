  # Observability stack — Netdata (active lightweight setup)
  netdata:
    image: docker.io/netdata/netdata:stable
    container_name: medilog_netdata
    restart: unless-stopped
    hostname: medilog-local
    mem_limit: "${NETDATA_MEMORY_LIMIT:-256m}"
    ports:
      - "19999:19999"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./observability/netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ./observability/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
    # Official host-level Netdata setup can enable broader host monitoring,
    # but those options are left commented to keep this local stack lean.
