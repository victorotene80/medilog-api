services:
  postgres:
    image: postgres:17-alpine
    container_name: medilog_postgres
    restart: unless-stopped
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-512MB}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-384MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}"
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-medilog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medilog}
      POSTGRES_DB: ${DB_NAME:-medilog}
    volumes:
      - medilog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medilog} -d ${DB_NAME:-medilog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medilog_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-redis}"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Messaging stack — enabled with: docker compose --profile messaging up
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medilog_kafka
    restart: unless-stopped
    profiles: ["messaging"]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: medilog_rabbitmq
    restart: unless-stopped
    profiles: ["messaging"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: medilog_kafka_ui
    restart: unless-stopped
    profiles: ["messaging"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Observability stack — Netdata (active lightweight setup)
  netdata:
    image: docker.io/netdata/netdata:stable
    container_name: medilog_netdata
    restart: unless-stopped
    hostname: medilog-local
    mem_limit: "${NETDATA_MEMORY_LIMIT:-256m}"
    ports:
      - "127.0.0.1:19999:19999"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./observability/netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ./observability/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata

  # Observability stack — OTel collector (used when OTEL_ENABLED=true).
  # Enabled with: docker compose --profile observability up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: medilog_otel_collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/otel/config.alloy:ro
    ports:
      - "4317:4317"

  # Observability stack — Prometheus + Grafana (previous implementation).
  # Enabled with: docker compose --profile observability up
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: medilog_prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: docker.io/grafana/grafana:10.4.2
    container_name: medilog_grafana
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medilog-api-api:latest
    container_name: medilog_api
    restart: unless-stopped
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Docker service-name overrides.
      # These override any local-development values in .env.
      DB_HOST: postgres
      DB_PORT: 5432
      # The compose Postgres serves plaintext only. DB_SSLMODE defaults to
      # require so that a real deployment cannot fall back to an unencrypted
      # connection by omission; local development opts out here, explicitly.
      DB_SSLMODE: disable

      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Go runtime memory hints for local Compose.
      GOMEMLIMIT: ${API_GOMEMLIMIT:-384MiB}
      GOGC: ${API_GOGC:-75}

      # Messaging (opt-in): run `docker compose --profile messaging up`.
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_DSN: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/

      # Telemetry (opt-in): run `docker compose --profile observability up`.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: medilog-api
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
      OTEL_EXPORTER_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_INSECURE: "true"

      # Schema management.
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-false}
      DB_VERIFY_SCHEMA: ${DB_VERIFY_SCHEMA:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  medilog_postgres_data:
  redis_data:
  netdata_lib:
  netdata_cache:
  prometheus_data:
  grafana_data:
