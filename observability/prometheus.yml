global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: medilog
    environment: docker

scrape_configs:
  # Prometheus scrapes itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Collector self-metrics (pipeline health, queue sizes, etc.)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]