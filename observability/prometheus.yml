global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: medilog
    environment: docker

scrape_configs:
  # Prometheus scrapes itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API application metrics (promhttp /metrics endpoint)
  - job_name: medilog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]