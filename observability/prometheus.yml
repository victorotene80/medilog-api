global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: medilog
    environment: local

scrape_configs:
  # Prometheus scrapes itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API application metrics (running natively on Mac)
  - job_name: medilog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.0.3:8080"]
    scrape_timeout: 10s
    scrape_interval: 15s