# Production stack for a self-hosted Oracle Cloud Always Free VM.
#
# Runs everything on one box: Postgres, Redis, the API, a Caddy reverse proxy
# that terminates TLS, and a tiny cron loop that replaces Cloud Scheduler for
# driving the reminder tick. Unlike the Cloud Run setup this VM never scales
# to zero, so nothing here needs to survive CPU throttling between requests.
#
# Deploy with: docker compose -f docker-compose.prod.yml up -d
# (scripts/deploy.sh wraps this with a git pull + migrate step.)

services:
  postgres:
    image: postgres:17-alpine
    container_name: medilog_postgres
    restart: unless-stopped
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1024MB}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}"
    ports:
      # Only reachable from the VM itself — never exposed to the internet.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-medilog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-medilog}
    volumes:
      - medilog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medilog} -d ${DB_NAME:-medilog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medilog_redis
    restart: unless-stopped
    mem_limit: "${REDIS_MEMORY_LIMIT:-512mb}"
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-384mb}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - medilog_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations, then exits. Run explicitly before (re)starting
  # `api`, not as a normal long-running service — see scripts/deploy.sh.
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: medilog-api:latest
    entrypoint: ["./migrate", "up"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medilog-api:latest
    container_name: medilog_api
    restart: unless-stopped
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Not published publicly — Caddy proxies to this over the compose network.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOMEMLIMIT: ${API_GOMEMLIMIT:-384MiB}
      GOGC: ${API_GOGC:-75}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Replaces Cloud Scheduler: hits the reminder tick endpoint once a minute.
  # Kept as a separate container (not cron on the host) so the whole stack is
  # reproducible from this one compose file.
  scheduler-cron:
    image: alpine:3.20
    container_name: medilog_scheduler_cron
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SCHEDULER_TICK_TOKEN: ${SCHEDULER_TICK_TOKEN:?SCHEDULER_TICK_TOKEN is required when SCHEDULER_ENABLED=true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -sf -X POST -H "X-Scheduler-Token: $$SCHEDULER_TICK_TOKEN" \
            http://api:8080/internal/scheduler/reminders/tick \
            || echo "reminder tick failed"
          sleep 60
        done
    profiles:
      - scheduler

  caddy:
    image: caddy:2-alpine
    container_name: medilog_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  medilog_postgres_data:
  medilog_redis_data:
  caddy_data:
  caddy_config:
