        maxLength: 100
        type: string
      is_active:
        type: boolean
      target_age_max:
        minimum: 0
        type: integer
      target_age_min:
        minimum: 0
        type: integer
      target_country_code:
        maxLength: 10
        type: string
      text:
        minLength: 1
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - text
    - title
    type: object
  request.CreateMedicationRequest:
    properties:
