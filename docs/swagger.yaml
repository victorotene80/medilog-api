host: localhost:8080
info:
  contact: {}
  description: HTTP API for MediLog authentication, health records, medication tracking,
    AI conversations, drug verification, and reference data.
  title: MediLog API
  version: "1.0"
paths:
  /ai/conversations/:
    get:
      description: Lists AI conversations for the authenticated user.
      parameters:
      - description: Return only active conversations
        in: query
        name: active_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-array_response_AIConversationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: List AI conversations
      tags:
      - AI Conversations
    post:
      consumes:
      - application/json
      description: Creates an AI conversation for the authenticated user.
      parameters:
      - description: AI conversation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CreateAIConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse-response_AIConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Create AI conversation
      tags:
      - AI Conversations
  /ai/conversations/{publicId}:
    get:
      description: Gets one AI conversation by public ID.
      parameters:
      - description: AI conversation public ID
        in: path
        name: publicId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_AIConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Get AI conversation
      tags:
      - AI Conversations
    patch:
      description: Updates an AI conversation by public ID (e.g. rename title).
      parameters:
      - description: AI conversation public ID
        in: path
        name: publicId
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.UpdateAIConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_AIConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Update AI conversation
      tags:
      - AI Conversations
  /ai/conversations/{publicId}/archive:
    patch:
      description: Archives one AI conversation by public ID.
      parameters:
      - description: AI conversation public ID
        in: path
        name: publicId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Archive AI conversation
      tags:
      - AI Conversations
  /ai/conversations/{publicId}/messages:
    post:
      consumes:
      - application/json
      description: Sends a user message and returns the saved message plus AI reply.
      parameters:
      - description: AI conversation public ID
        in: path
        name: publicId
        required: true
        type: string
      - description: AI message payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.SendAIMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse-response_SendAIMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Send AI message
      tags:
      - AI Conversations
  /ai/quota:
    get:
      description: Returns how many AI questions the user has used and has left,
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_AIQuotaResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      security:
      - BearerAuth: []
      summary: Get the caller's AI question quota
      tags:
      - AI Conversations
  /auth/change-password:
