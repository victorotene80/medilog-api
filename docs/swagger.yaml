      name:
        maxLength: 200
        minLength: 1
        type: string
      phone:
        type: string
      relationship:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - country_code
    - name
    - phone
    - relationship
    type: object
  request.CreateFunFactRequest:
