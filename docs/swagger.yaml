  /auth/google:
    post:
      consumes:
      - application/json
      description: Authenticates a user with a Google ID token.
      parameters:
      - description: Google login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_GoogleAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      summary: Authenticate with Google
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in with email or phone plus password.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the current authenticated session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse-response_EmptyData'
