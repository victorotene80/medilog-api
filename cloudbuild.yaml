# Build -> push -> migrate -> deploy, for Cloud Run.
#
# Run it with:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_CLOUDSQL_INSTANCE=PROJECT:REGION:INSTANCE
#
# Everything environment-specific is a substitution; secrets are never passed
# through here — the service reads them from Secret Manager at start-up (see
# --set-secrets on the deploy step).

substitutions:
  # SHORT_SHA is only populated for builds started by a Cloud Build trigger; a
  # manual `gcloud builds submit` leaves it empty, which would yield an image
  # tag ending in ":" and fail the push. _TAG keeps both paths working — a
  # trigger should set _TAG=$SHORT_SHA in its own substitutions.
  _TAG: latest
  _REGION: us-central1
  _REPO: medilog                 # Artifact Registry repository
  _SERVICE: medilog-api          # Cloud Run service
  _JOB: medilog-migrate          # Cloud Run job that applies SQL migrations
  _SCHEDULER_JOB: medilog-reminder-tick
  _SCHEDULER_CRON: '* * * * *'   # every minute, matching SCHEDULER_POLL_INTERVAL
  _CLOUDSQL_INSTANCE: ''         # PROJECT:REGION:INSTANCE
  _DB_NAME: medilog
  _DB_USER: medilog
  _VPC_NETWORK: default          # network Memorystore Redis lives on
  _VPC_SUBNET: default
  _REDIS_HOST: ''                # Memorystore private IP
  _REDIS_PORT: '6379'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  # The Dockerfile uses `FROM --platform=$BUILDPLATFORM`, and BUILDPLATFORM is a
  # BuildKit-only build arg. Without this the classic builder expands it to an
  # empty string and the build fails on the FROM line.
  env:
    - DOCKER_BUILDKIT=1

# No top-level `images:` block on purpose. Cloud Build pushes those only after
# every step has finished, but the migrate step needs the image in Artifact
# Registry before it runs — a Cloud Run Job pulls it. The explicit push step
# below does it at the right moment instead.

steps:
  # 1. Build. Cloud Build workers are amd64, so TARGETARCH resolves to the
  #    architecture Cloud Run needs without passing --platform.
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}']

  # 2. Apply migrations before the new revision serves traffic.
  #
  #    The job runs the same image with the entrypoint overridden to
  #    /app/migrate. cmd/migrate builds its own DSN from the DB_* variables and
  #    recognises an absolute DB_HOST as a Cloud SQL unix socket, so the
  #    password can stay in Secret Manager instead of being interpolated into a
  #    DATABASE_URL here.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}"

        # Create the job on first run, update it on every run after that.
        if gcloud run jobs describe "${_JOB}" --region "${_REGION}" >/dev/null 2>&1; then
          VERB=update
        else
          VERB=create
        fi

        gcloud run jobs "$$VERB" "${_JOB}" \
          --region "${_REGION}" \
          --image "$$IMAGE" \
          --command /app/migrate \
          --args up \
          --set-cloudsql-instances "${_CLOUDSQL_INSTANCE}" \
          --set-env-vars "DB_HOST=/cloudsql/${_CLOUDSQL_INSTANCE},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}" \
          --set-secrets "DB_PASSWORD=medilog-db-password:latest" \
          --max-retries 1 \
          --task-timeout 10m

        gcloud run jobs execute "${_JOB}" --region "${_REGION}" --wait

  # 3. Deploy the service.
  #
  #    Scales to zero. The reminder ticker that used to require
  #    --min-instances=1 --no-cpu-throttling (~$46/month to keep a one-minute
  #    timer alive) is disabled in code; step 4 has Cloud Scheduler call the
  #    tick endpoint instead, which arrives as an ordinary request and so gets
  #    ordinary CPU. The outbox relay is not a factor: MESSAGING_ENABLED
  #    defaults to false and nothing here turns it on.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      # --timeout must exceed the worst-case reminder scan, or Cloud Run cuts
      # the tick request off mid-scan. The scan is bounded by SCHEDULER_BATCH_SIZE
      # (500), so 120s is generous; raise both together if the batch grows.
      - --timeout=120s
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      # Memorystore is private-IP only, and bootstrap/redis.go treats a failed
      # ping as fatal — without egress onto the VPC the service cannot boot.
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      # Every variable config/loader.go reads without a default has to be here
      # or in --set-secrets; the service fatals at start-up on the first one it
      # cannot find. DB_SSLMODE stays "require" even though the Cloud SQL socket
      # makes it moot (pgx ignores TLS settings on a unix socket) so that
      # pointing DB_HOST at a TCP address later cannot silently go plaintext.
      - --set-env-vars=^@^DB_HOST=/cloudsql/${_CLOUDSQL_INSTANCE}@DB_PORT=5432@DB_NAME=${_DB_NAME}@DB_USER=${_DB_USER}@DB_SSLMODE=require@REDIS_HOST=${_REDIS_HOST}@REDIS_PORT=${_REDIS_PORT}@DB_AUTO_MIGRATE=false@DB_VERIFY_SCHEMA=true@SCHEDULER_ENABLED=true@AI_ENABLED=true@AI_CONTEXT_WINDOW_TOKENS=100000@AI_MAX_CONTEXT_MESSAGES=20@AI_SUMMARY_TOKEN_THRESHOLD=50000@SMS_ENABLED=true@SMS_MAX_BULK_FAILURES=5@BULK_SMS_SENDER=MediLog@GOMEMLIMIT=384MiB@GOGC=75
      - --set-secrets=SESSION_PEPPER=medilog-session-pepper:latest,JWT_SECRET=medilog-jwt-secret:latest,DB_PASSWORD=medilog-db-password:latest,REDIS_PASSWORD=medilog-redis-password:latest,CLAUDE_API_KEY=medilog-claude-api-key:latest,GOOGLE_CLIENT_ID=medilog-google-client-id:latest,TWILIO_ACCOUNT_SID=medilog-twilio-account-sid:latest,TWILIO_AUTH_TOKEN=medilog-twilio-auth-token:latest,TELNYX_API_KEY=medilog-telnyx-api-key:latest,BULK_SMS_API_TOKEN=medilog-bulk-sms-api-token:latest,SCHEDULER_TICK_TOKEN=medilog-scheduler-tick-token:latest

  # 4. Point Cloud Scheduler at the tick endpoint.
  #
  #    This is what replaces the in-process ticker. Every minute it POSTs to the
  #    service, which wakes the container, runs one reminder scan and lets it go
  #    idle again — billed as a request rather than as an always-on instance.
  #
  #    The shared secret travels in a header rather than as an OIDC token
  #    because the service is --allow-unauthenticated (the mobile app calls it)
  #    so Cloud Run's own IAM check cannot gate this one path. The header is
  #    read from Secret Manager at deploy time and never appears in this file or
  #    in build logs.
  #
  #    Runs last: it needs the service URL, which only exists after deploy.
  - id: schedule
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" --format='value(status.url)')"
        TOKEN="$$(gcloud secrets versions access latest --secret=medilog-scheduler-tick-token)"

        if gcloud scheduler jobs describe "${_SCHEDULER_JOB}" --location "${_REGION}" >/dev/null 2>&1; then
          VERB=update
        else
          VERB=create
        fi

        # --attempt-deadline below the service's 120s request timeout, so a slow
        # scan is cut off by Cloud Run (which logs it) rather than abandoned by
        # the scheduler first.
        gcloud scheduler jobs "$$VERB" http "${_SCHEDULER_JOB}" \
          --location "${_REGION}" \
          --schedule "${_SCHEDULER_CRON}" \
          --time-zone UTC \
          --uri "$${URL}/internal/scheduler/reminders/tick" \
          --http-method POST \
          --update-headers "X-Scheduler-Token=$${TOKEN}" \
          --attempt-deadline 90s \
          --max-retry-attempts 2 \
          --min-backoff 10s

timeout: 1800s
